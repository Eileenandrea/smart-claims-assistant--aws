AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Smart Claims Assistant - Serverless Boilerplate

Globals:
  Function:
    Runtime: python3.11
    Timeout: 10
    MemorySize: 256

Parameters:
  ExistingBucketName:
    Type: String
    Default: "claims-bucket-acn"
    Description: "Existing S3 bucket name for claims (must exist in the same region as the stack)"

Resources:
  ### DynamoDB ###
  ClaimsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ClaimsTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: ClaimID
          AttributeType: S
      KeySchema:
        - AttributeName: ClaimID
          KeyType: HASH

  ### Lambda ###

  ClaimsHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ClaimsHandler
      CodeUri: src/lambda/claims_handler/
      Handler: app.lambda_handler
      Environment:
        Variables:
          TABLE_NAME: !Ref ClaimsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ClaimsTable
      Events:
        ApiRequest:
          Type: Api
          Properties:
            RestApiId: !Ref ClaimsApi
            Path: /claims
            Method: post

  ### Step Functions ###
  ClaimsStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: ClaimsWorkflow
      DefinitionUri: src/statemachine/claims_flow.asl.json
      DefinitionSubstitutions:
        ClaimsHandlerArn: !GetAtt ClaimsHandlerFunction.Arn
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref ClaimsHandlerFunction

  ClaimsProcessorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ClaimsProcessor
      CodeUri: src/lambda/claims_handler/
      Handler: processor.handler
      Runtime: python3.11
      Environment:
        Variables:
          BUCKET_NAME: !Ref ExistingBucketName
          TABLE_NAME: !Ref ClaimsTable
          TARGET_LANGUAGE: "es"
          VOICE_ID: "Joanna"
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - textract:AnalyzeDocument
                - bedrock:InvokeModel
                - polly:SynthesizeSpeech
                - translate:TranslateText
                - dynamodb:PutItem
                - dynamodb:GetItem
                - s3:PutObject
                - s3:GetObject
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: "*"
      # NOTE: S3 notification configuration for an existing bucket must be set outside
      #       the SAM template. See Outputs and README for instructions to add the
      #       bucket notification and ensure S3 is allowed to invoke the function.
      Events:
        ApiTest:
          Type: Api
          Properties:
            RestApiId: !Ref ClaimsApi
            Path: /process-s3
            Method: post

  ClaimsProcessorS3InvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt ClaimsProcessorFunction.Arn
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceArn: !Sub arn:aws:s3:::${ExistingBucketName}

  ### API Gateway ###
  ClaimsApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: ClaimsApi
      StageName: dev

  ### Amazon Lex (Placeholder) ###
  # ClaimsLexBot:
  #   Type: AWS::Lex::Bot
  #   Properties:
  #     Name: SmartClaimsLexBot
  #     RoleArn: arn:aws:iam::123456789012:role/LexServiceRole
  #     DataPrivacy:
  #       ChildDirected: false
  #     IdleSessionTTLInSeconds: 300

  ### Amazon Connect (Placeholder) ###
  # ClaimsConnectInstance:
  # Type: AWS::Connect::Instance
  # Properties:
  #   IdentityManagementType: CONNECT_MANAGED
  #   InstanceAlias: smart-claims-connect
  #   Attributes:
  #     InboundCalls: true
  #     OutboundCalls: true

Outputs:
  ApiUrl:
    Description: API Gateway endpoint
    Value: !Sub "https://${ClaimsApi}.execute-api.${AWS::Region}.amazonaws.com/dev/claims"

  BucketName:
    Description: S3 bucket for claims
    Value: !Ref ExistingBucketName

  TableName:
    Description: DynamoDB table name
    Value: !Ref ClaimsTable
