AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Smart Claims Assistant - Serverless Boilerplate
Globals:
  Function:
    Runtime: python3.11
    Timeout: 10
    MemorySize: 256
Resources:
  ClaimsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ClaimsTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: claimId
        AttributeType: S
      KeySchema:
      - AttributeName: claimId
        KeyType: HASH
  ClaimsHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ClaimsHandler
      CodeUri: ClaimsHandlerFunction
      Handler: app.lambda_handler
      Environment:
        Variables:
          TABLE_NAME:
            Ref: ClaimsTable
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: ClaimsTable
      Events:
        ApiRequest:
          Type: Api
          Properties:
            RestApiId:
              Ref: ClaimsApi
            Path: /claims
            Method: post
    Metadata:
      SamResourceId: ClaimsHandlerFunction
  ClaimsStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: ClaimsWorkflow
      DefinitionUri: ../../src/statemachine/claims_flow.asl.json
      DefinitionSubstitutions:
        ClaimsHandlerArn:
          Fn::GetAtt:
          - ClaimsHandlerFunction
          - Arn
      Policies:
      - LambdaInvokePolicy:
          FunctionName:
            Ref: ClaimsHandlerFunction
  ClaimsApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: ClaimsApi
      StageName: dev
Outputs:
  ApiUrl:
    Description: API Gateway endpoint
    Value:
      Fn::Sub: https://${ClaimsApi}.execute-api.${AWS::Region}.amazonaws.com/dev/claims
